version: '3.8'

services:
  biosearch-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biosearch-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - NCBI_EMAIL=researcher@example.com
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    deploy:
      resources:
        limits:
          memory: 1.5G
